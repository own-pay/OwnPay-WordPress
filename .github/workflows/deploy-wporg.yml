name: Deploy to WordPress.org

# Normally fired by release.yml explicitly dispatching this workflow right
# after it pushes a "v*" release tag (see release.yml's "Trigger WordPress.org
# deploy" step). It canNOT rely on that tag push itself as the trigger: tags
# pushed using the default GITHUB_TOKEN do not start other workflow runs
# (GitHub's anti-recursion rule), so the `push: tags` trigger below is kept
# only as a fallback for a tag pushed manually/locally by a maintainer.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version to deploy (e.g. 1.3.1). Required for this trigger (manual run or release.yml); ignored on a tag push, which derives it from the tag.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Push tag to WordPress.org SVN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1

      - name: Resolve plugin version
        id: version
        # DISPATCH_VERSION is passed through env and read as a quoted shell
        # variable rather than interpolating ${{ inputs.version }} straight
        # into the script - GitHub Actions substitutes expressions as raw
        # text before the shell ever runs, so inlining untrusted/arbitrary
        # input there is a script-injection risk.
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
            if [ -z "$VERSION" ]; then
              echo "::error::workflow_dispatch requires a non-empty 'version' input."
              exit 1
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
            if [ -z "$VERSION" ]; then
              echo "::error::Could not resolve a plugin version from the pushed tag."
              exit 1
            fi
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not a valid X.Y.Z semantic version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $VERSION"

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable (2024-10)
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ownpay-payment-gateway
          VERSION: ${{ steps.version.outputs.version }}
          ASSETS_DIR: screenshots
