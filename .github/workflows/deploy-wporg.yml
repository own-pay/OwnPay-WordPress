name: Deploy to WordPress.org

# Normally fired by release.yml explicitly dispatching this workflow right
# after it pushes a "v*" release tag (see release.yml's "Trigger WordPress.org
# deploy" step). It canNOT rely on that tag push itself as the trigger: tags
# pushed using the default GITHUB_TOKEN do not start other workflow runs
# (GitHub's anti-recursion rule), so the `push: tags` trigger below is kept
# only as a fallback for a tag pushed manually/locally by a maintainer.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version to deploy (e.g. 1.3.1). Required when dispatched manually or from release.yml; ignored on a tag push, which derives it from the tag.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Push tag to WordPress.org SVN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1

      - name: Resolve plugin version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve a plugin version to deploy."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $VERSION"

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable (2024-10)
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ownpay-payment-gateway
          VERSION: ${{ steps.version.outputs.version }}
          ASSETS_DIR: screenshots
